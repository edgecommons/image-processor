; supervisord program block for ImageProcessor on the HOST platform.
;
; NOTE: in a rendered deployment this file is OWNED BY THE DEPLOYMENT RENDERER — the EdgeCommons
; Deployment Studio HOST renderer regenerates it from the deployment model (install paths, config
; paths, thing name, user, log dirs). Hand-edits are overwritten on the next render. Treat the copy
; in this repo as the template default / a standalone reference you can run yourself:
;
;   sudo cp supervisor/component.conf /etc/supervisor/conf.d/ImageProcessor.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status ImageProcessor
;
; Expected layout (what the renderer lays down):
;   /opt/edgecommons/ImageProcessor/main.py + image_processor/         the component (pip install -r requirements.txt)
;   /opt/edgecommons/ImageProcessor/.venv/                 its virtualenv (edgecommons + deps)
;   /etc/edgecommons/ImageProcessor/config.json            the component config    (-c FILE)
;   /etc/edgecommons/ImageProcessor/standalone-messaging.json         the MQTT broker config  (--transport MQTT)
;   /var/log/edgecommons/                                     stdout/stderr logs

[program:ImageProcessor]
; -u keeps stdout/stderr unbuffered so supervisord's logs stay live.
command=/opt/edgecommons/ImageProcessor/.venv/bin/python -u /opt/edgecommons/ImageProcessor/main.py --platform HOST --transport MQTT /etc/edgecommons/ImageProcessor/standalone-messaging.json -c FILE /etc/edgecommons/ImageProcessor/config.json -t image-processor-dev
directory=/opt/edgecommons/ImageProcessor
user=edgecommons
environment=PYTHONUNBUFFERED="1",PYTHONDONTWRITEBYTECODE="1"

autostart=true
autorestart=true
startsecs=10
startretries=3
priority=200

; The library installs a SIGTERM handler that runs its graceful, idempotent shutdown (flip /readyz
; to 503, unsubscribe, close messaging/metrics/streams). Give it room to finish.
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true

stdout_logfile=/var/log/edgecommons/ImageProcessor.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/edgecommons/ImageProcessor.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
redirect_stderr=false
