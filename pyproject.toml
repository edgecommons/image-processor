[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "image-processor"
version = "0.1.0"
description = "Image inference processor: loads image-model bundles (ONNX Runtime, NVIDIA GPU), runs inference on finalized image files or subscription-triggered images, and publishes versioned inference results with evidence."
requires-python = ">=3.9"
dependencies = [
    # The edgecommons Python library, in the same form as requirements.txt (the CLI substitutes
    # the `--dep-source` you chose: a pinned git requirement for `registry`/`pinned-rev`, a
    # `file://` reference to the sibling checkout for `local`). The org's component CI installs
    # from this list (`pip install -e .`), so keep it in sync with requirements.txt -- bump both
    # with `edgecommons component upgrade`.
    "edgecommons @ git+https://github.com/edgecommons/edgecommons@8e688894845152de612abe39e04c9e07d3f183c5#subdirectory=libs/python",
    # TODO: add your component's own runtime dependencies here.
    # WP5 (sources): the spool source turns OS filesystem notifications into scan nudges.
    "watchdog>=3.0.0",
    # WP2 (bundles): Ed25519 bundle signatures and model-bundle-manifest schema validation.
    "cryptography>=42",
    "jsonschema>=4.21",
    # WP4a -- engine: decode, task families, decision rules.
    "numpy>=1.26",
    "pillow>=10",
    "jsonpath-ng>=1.6",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
# WP4a appends `onnx`: the fixture builder generates the synthetic graphs; the runtime never
# imports it.
test = ["pytest>=7", "pytest-cov", "onnx>=1.15"]
# WP2 (bundles): `s3://` model sources. boto3 is never a hard dependency; without it an `s3://`
# URI fails with BundleError("S3_UNAVAILABLE").
s3 = ["boto3>=1.34"]

[tool.setuptools.packages.find]
# Every subpackage of image_processor ships in the wheel (the reusable CI and the Dockerfile
# install from this manifest).
include = ["image_processor*"]

[tool.pytest.ini_options]
# The package resolves from the repo root without an install (the CI/scaffold-build gate runs
# `python -m pytest`); `pip install -e .` also works.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
