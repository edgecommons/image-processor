# Greengrass v2 recipe for ImageProcessor.
#
# The `component` block below is the same contract `config.schema.json` describes and
# `test-configs/config.json` demonstrates; a deployment overrides it per device.
#
# Two settings are the development profile rather than a decision-serving one: `gpu.devices` is
# empty and `runtime.allowCpuOnly` is set, which runs inference on the CPU. A device that serves
# decisions names its GPU ordinals and drops `allowCpuOnly`, so a route whose provider policy
# cannot be satisfied fails closed instead of answering from the CPU.
#
# `models[].uri` points at a local tarball. Point it at the `s3://` object your deployment
# publishes and add the bucket prefix to `modelSources.allowedUriPrefixes`.
RecipeFormatVersion: '2020-01-25'
ComponentName: com.mbreissi.edgecommons.ImageProcessor
ComponentVersion: 1.0.0
ComponentDescription: 'Image inference processor: loads signed image-model bundles (ONNX Runtime, NVIDIA
  GPU), runs inference on finalized image files or subscription-triggered images, and publishes a durably
  confirmed inference result per image.'
ComponentPublisher: EdgeCommons
ComponentDependencies:
  aws.greengrass.TokenExchangeService:
    VersionRequirement: '>=2.0.0'
    DependencyType: HARD
ComponentConfiguration:
  DefaultConfiguration:
    ComponentConfig:
      logging:
        level: INFO
        python_format: '%(asctime)s [%(levelname)s] %(filename)s %(funcName)s(%(lineno)d) [%(threadName)s]:
          %(message)s'
      heartbeat:
        enabled: true
        intervalSecs: 5
        measures:
          cpu: true
          memory: true
        destination: local
      tags: {}
      metricEmission:
        target: cloudwatch
        namespace: edgecommons
        targetConfig:
          intervalSecs: 10
      component:
        token: image-processor
        global:
          paths:
            stateDb: /var/lib/edgecommons/image-processor/state.db
            modelCache: /var/lib/edgecommons/image-processor/models
            staging: /var/lib/edgecommons/image-processor/staging
          runtime:
            providers:
            - CPUExecutionProvider
            requiredProvider: CPUExecutionProvider
            allowCpuOnly: true
            executorCellsPerGpu: 1
            loadConcurrencyPerGpu: 1
          gpu:
            devices: []
            residentMemoryBudgetPercent: 80
            reserveMiB: 512
          scheduler:
            maxBatchSize: 1
            maxBatchLatencyMs: 20
            hotTtlSecs: 120
            minResidencySecs: 15
            maxAttempts: 5
            retryBackoffSecs: 2
            maxRetryBackoffSecs: 60
            queueAgeWarningSecs: 300
          discovery:
            rescanSecs: 15
            debounceMs: 250
          publish:
            confirmationTimeoutSecs: 10
            maxAttempts: 20
            outboxCapacity: 10000
            outboxReserveBudgetMiB: 64
          modelSources:
            allowedSchemes:
            - file
            allowedUriPrefixes: []
            verifyTls: true
          signing:
            required: false
            trustedKeys: []
          models:
          - id: synthetic-anomaly-scalar
            version: 1.0.0
            digest: sha256:7dfefce8aed303b4e2b6b17206ee61cd14d06883707b0bd37d4584d3c3a28f00
            uri: /var/lib/edgecommons/image-processor/bundles/synthetic-anomaly-scalar-1.0.0.tar
            activation:
              requireWarmup: true
              retainForRollback: true
          completionDefaults:
            onSuccess: archive
            onInvalidInput: quarantine
            onOperationalFailure: retainInPlace
            onPublishFailure: retainInPlace
            onCollision: fail
        instances:
        - id: clearance-cam-01
          priority: 100
          source:
            kind: spool
            root: /var/spool/camera-adapter/cam-01
            include:
            - '**/*.jpg'
            - '**/*.jpeg'
            - '**/*.png'
            readiness:
              mode: cameraSidecar
            camera:
              component: camera-adapter
              instance: cam-01
              subscribeAnnouncements: true
              reconcileCaptureStatusSecs: 30
          modelRef:
            id: synthetic-anomaly-scalar
            version: 1.0.0
            digest: sha256:7dfefce8aed303b4e2b6b17206ee61cd14d06883707b0bd37d4584d3c3a28f00
          outputs:
            writeResultSidecar: true
            decisionSignals:
            - id: line-clearance/pass
              value: $.decision.pass
            - id: line-clearance/confidence
              value: $.decision.confidence
            - id: line-clearance/status
              value: $.status
          completion:
            onSuccess: archive
            archiveDir: /var/spool/image-processor/processed/cam-01
            failedDir: /var/spool/image-processor/failed/cam-01
        - id: adhoc-inspect
          priority: 50
          source:
            kind: trigger
            subscribe:
            - ecv1/+/inspection-ui/+/app/inspect/request
            fileRoot: /var/spool/inspection
            inlineStaging: /var/lib/edgecommons/image-processor/staging/adhoc
          modelRef:
            id: synthetic-anomaly-scalar
            version: 1.0.0
            digest: sha256:7dfefce8aed303b4e2b6b17206ee61cd14d06883707b0bd37d4584d3c3a28f00
          outputs:
            writeResultSidecar: false
            decisionSignals:
            - id: adhoc/pass
              value: $.decision.pass
          completion:
            onSuccess: delete
    accessControl:
      aws.greengrass.ipc.pubsub:
        com.mbreissi.edgecommons.ImageProcessor:ipc:1:
          policyDescription: Allows access to publish/subscribe to all topics on IPC
          operations:
          - aws.greengrass#PublishToTopic
          - aws.greengrass#SubscribeToTopic
          resources:
          - '*'
      aws.greengrass.ipc.mqttproxy:
        com.mbreissi.edgecommons.ImageProcessor:iotcore:1:
          policyDescription: Allows access to publish/subscribe to all topics on IoT Core.
          operations:
          - aws.greengrass#PublishToIoTCore
          - aws.greengrass#SubscribeToIoTCore
          resources:
          - '*'
      aws.greengrass.ShadowManager:
        com.mbreissi.edgecommons.ImageProcessor:shadow:1:
          policyDescription: Allows access to shadows.
          operations:
          - aws.greengrass#GetThingShadow
          - aws.greengrass#UpdateThingShadow
          - aws.greengrass#DeleteThingShadow
          resources:
          - '*'
Manifests:
- Platform:
    os: all
  Artifacts:
  - URI: s3://BUCKET_NAME/COMPONENT_NAME/COMPONENT_VERSION/image-processor.zip
    Unarchive: ZIP
  Lifecycle:
    install:
      Script: 'set -e

        COMPONENT_DIR="{work:path}"

        python3 -m venv "$COMPONENT_DIR/venv"

        . $COMPONENT_DIR/venv/bin/activate

        pip3 install --upgrade pip

        pip3 install -r {artifacts:decompressedPath}/image-processor/requirements.txt

        deactivate'
    Run:
      Script: 'set -e

        COMPONENT_DIR="{work:path}"

        . $COMPONENT_DIR/venv/bin/activate

        python3 -u {artifacts:decompressedPath}/image-processor/main.py --platform GREENGRASS'
