# Component config for Kubernetes, mounted as a DIRECTORY at /etc/edgecommons so the CONFIGMAP
# source watches the kubelet ..data swap and hot-reloads in-process (no restart). config.json
# carries BOTH the component config AND the messaging block (in-cluster broker via Service DNS).
# Edit this and `kubectl apply -f k8s/` to drive a hot reload. Point host at your broker Service.
#
# A processor with no routes has nothing to run and refuses to start — deliberately: a processor that
# silently does nothing is worse. So one working route is declared below. `publishTopic` must name
# THIS device: on Kubernetes the device token is the pod's resolved identity (Downward API), so set
# it to the pod name you deploy under.
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-processor-config
  labels:
    app.kubernetes.io/name: image-processor
data:
  config.json: |-
    {
      "hierarchy": {
        "levels": [
          "site",
          "device"
        ]
      },
      "identity": {
        "site": "site1"
      },
      "messaging": {
        "local": {
          "type": "mqtt",
          "host": "emqx.default.svc.cluster.local",
          "port": 1883,
          "clientId": "image-processor"
        }
      },
      "logging": {
        "level": "INFO"
      },
      "metricEmission": {
        "target": "log",
        "namespace": "edgecommons"
      },
      "component": {
        "token": "image-processor",
        "global": {
          "defaults": {
            "tickMs": 10000,
            "maxQueue": 256
          }
        },
        "instances": [
          {
            "id": "rollup",
            "subscribe": [
              "ecv1/+/+/+/data/#"
            ],
            "publishTopic": "ecv1/gw-01/image-processor/rollup/data/summary",
            "target": "local",
            "pipeline": [
              {
                "fieldEquals": {
                  "path": "signal.id",
                  "value": "temperature-1"
                }
              },
              {
                "countPerTick": {}
              }
            ],
            "tickMs": 10000
          }
        ]
      }
    }
